spring:
  application:
    name: nexus-commerce
  datasource:
    url: jdbc:postgresql://db:5432/${DB_DATABASE}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: false
  flyway:
    locations: classpath/db/migration
server:
  port:8080
